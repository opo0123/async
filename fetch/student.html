<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학생 정보 관리</title>
  </head>
  <style>
    body {
      background-color: #fefff6;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    img {
      width: 100%;
      display: block;
    }
    h1 {
      margin: 100px auto;
      text-align: center;
    }
    .container {
      max-width: 1200px;
      margin: 100px auto;
      padding: 20px;
    }
    .student-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card-content {
      padding: 15px;
    }
    .card-content h3 {
      margin-bottom: 10px;
    }
    /* 모달 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      /* display: flex; */
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      position: relative;
      width: 500px;
      background-color: #fff;
      border-radius: 10px;
      padding: 30px;
    }
    .modal-content img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 20px;
    }
    .close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
  <body>
    <h1>학생 정보 관리</h1>
    <div class="container">
      <div id="studentList" class="student-list">
        <!-- js 출력 -->
      </div>
    </div>
    <!-- 클릭 시 모달 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="detail">
          <!-- js 출력 -->
        </div>
      </div>
    </div>
    <script>
      const studentList = document.querySelector("#studentList");
      const modal = document.querySelector("#modal");
      const detail = document.querySelector("#detail");
      const closeBtn = document.querySelector(".close");

      // json 불러오기
      fetch("student.json")
        // 요청 보내기 (응답 받아오기)
        .then((response) => {
          return response.json();
        })
        // 요청
        .then((data) => {
          data.forEach((student) => {
            // div 생성 (card)
            const card = document.createElement("div");
            card.classList.add("card");

            // card 내용 추가
            card.innerHTML = `<img src="${student.image}" alt="${student.name}" />
              <div class="card-content">
                <h3>${student.name}</h3>
                <p>${student.major}</p>
              </div>`;

            // card 내용 자식으로 추가하기
            studentList.appendChild(card);

            // 카드 클릭 시
            card.addEventListener("click", () => {
              // 내용 넣기
              detail.innerHTML = `
                 <img src="${student.image}" alt="${student.name}">
                 <h2>${student.name}</h2>
                 <br>
                 <p><strong>학번 :</strong> ${student.id}</p>
                 <p><strong>전공 :</strong> ${student.major}</p>
                 <p><strong>전화번호 :</strong> ${student.phone}</p>
                 <p><strong>이메일 :</strong> ${student.email}</p>`;

              // active class 추가
              modal.classList.add("active");
            });
          });
        })
        // 오류
        .catch((error) => {
          console.log(error);
        });

      // close 기능
      closeBtn.addEventListener("click", () => {
        modal.classList.remove("active");
      });
      // 배경 클릭 시 close
      modal.addEventListener("click", function () {
        this.classList.remove("active");
      });
    </script>
  </body>
</html>
