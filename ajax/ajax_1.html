<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비동기</title>
  </head>
  <body>
    <script>
      // 비동기 : 어떤 작업이 끝날 때까지 기다리지 않고, 다음 코드를 먼저 실행하는 방식
      // 서버 통신 기능
      const xhr = new XMLHttpRequest();
      // console.log(xhr);
      xhr.open("GET", "data.json", true);
      xhr.onload = function () {
        console.log(xhr);
        // status: 200 = 요청 성공
        // status: 400 = 클라이언트 오류
        // status: 404 = 파일 없음
        // status: 500 = 서버 오류

        // 서버 요청 성공했으면
        if (xhr.status === 200) {
          // JSON.parse() = 문자열(JSON형식) -> JS객체로 변환
          const data = JSON.parse(xhr.responseText);
          // console.log(data);
          document.write(`이름 : ${data.name}<br/>나이 : ${data.age}`);
        }
      };
      xhr.send();
    </script>
  </body>
</html>
